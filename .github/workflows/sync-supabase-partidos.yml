name: Sincronizar partidos y sets con Supabase

on:
  push:
    branches:
      - main
    paths:
      - 'docs/estado_torneo.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-supabase-partidos
  cancel-in-progress: false

jobs:
  sync-partidos:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Validar estado del torneo
        shell: bash
        run: |
          set -euo pipefail

          test -f docs/estado_torneo.json

          jq -e '.configuracion | type == "object"' docs/estado_torneo.json > /dev/null
          jq -e '.configuracion.codigo_campeonato | type == "string" and length > 0' docs/estado_torneo.json > /dev/null

          echo "Campeonato: $(jq -r '.configuracion.codigo_campeonato' docs/estado_torneo.json)"
          echo "Estado: $(jq -r '.configuracion.estado_torneo // ""' docs/estado_torneo.json)"
          echo "Partidos Liguilla: $(jq '.partidos // [] | length' docs/estado_torneo.json)"
          echo "Partidos Grupos: $(jq '.grupos.partidos // [] | length' docs/estado_torneo.json)"
          echo "Partidos ReGrupos: $(jq '.regrupos.partidos // [] | length' docs/estado_torneo.json)"
          echo "Cruces: $(jq '.cruces // [] | length' docs/estado_torneo.json)"

      - name: Sincronizar partidos y sets con Supabase
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SECRET_KEY:-}" ]; then
            echo "Faltan SUPABASE_URL o SUPABASE_SECRET_KEY en GitHub Secrets."
            exit 1
          fi

          jq -n \
            --slurpfile payload docs/estado_torneo.json \
            '{p_payload: $payload[0]}' \
            > /tmp/supabase_body.json

          HTTP_CODE=$(curl --silent --show-error \
            --output /tmp/supabase_response.json \
            --write-out '%{http_code}' \
            --request POST \
            --header "apikey: ${SUPABASE_SECRET_KEY}" \
            --header 'Content-Type: application/json' \
            --data-binary @/tmp/supabase_body.json \
            "${SUPABASE_URL%/}/rest/v1/rpc/sync_partidos_sets_excel")

          echo "HTTP ${HTTP_CODE}"
          cat /tmp/supabase_response.json
          echo

          if [[ "${HTTP_CODE}" -lt 200 || "${HTTP_CODE}" -ge 300 ]]; then
            echo "La sincronización de partidos y sets con Supabase ha fallado."
            exit 1
          fi

          jq -e '.ok == true' /tmp/supabase_response.json > /dev/null

          echo "Partidos recibidos: $(jq -r '.partidos_recibidos // 0' /tmp/supabase_response.json)"
          echo "Partidos procesados: $(jq -r '.partidos_procesados // 0' /tmp/supabase_response.json)"
          echo "Sets procesados: $(jq -r '.sets_procesados // 0' /tmp/supabase_response.json)"
          echo "Participantes procesados: $(jq -r '.participantes_procesados // 0' /tmp/supabase_response.json)"
          echo "Partidos y sets sincronizados correctamente."
