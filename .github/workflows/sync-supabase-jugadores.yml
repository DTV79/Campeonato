name: Sincronizar jugadores con Supabase

on:
  push:
    branches:
      - main
    paths:
      - 'docs/supabase_jugadores.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-supabase-jugadores
  cancel-in-progress: false

jobs:
  sync-jugadores:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Validar JSON
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/supabase_jugadores.json
          jq -e '
            (.origen | type == "string") and
            (.jugadores | type == "array") and
            ([.jugadores[] |
              (.id_jugador | type == "string") and
              (.nombre_oficial | type == "string") and
              (.alias | type == "string") and
              ((.activo | type) == "boolean")
            ] | all)
          ' docs/supabase_jugadores.json > /dev/null

      - name: Sincronizar con Supabase
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SECRET_KEY:-}" ]; then
            echo "Faltan SUPABASE_URL o SUPABASE_SECRET_KEY en GitHub Secrets."
            exit 1
          fi

          jq -n \
            --slurpfile payload docs/supabase_jugadores.json \
            '{p_payload: $payload[0]}' \
            > /tmp/supabase_body.json

          HTTP_CODE=$(curl --silent --show-error \
            --output /tmp/supabase_response.json \
            --write-out '%{http_code}' \
            --request POST \
            --header "apikey: ${SUPABASE_SECRET_KEY}" \
            --header 'Content-Type: application/json' \
            --data-binary @/tmp/supabase_body.json \
            "${SUPABASE_URL%/}/rest/v1/rpc/sync_jugadores_excel")

          echo "HTTP ${HTTP_CODE}"
          cat /tmp/supabase_response.json
          echo

          if [[ "${HTTP_CODE}" -lt 200 || "${HTTP_CODE}" -ge 300 ]]; then
            echo "La sincronización con Supabase ha fallado."
            exit 1
          fi

          jq -e '.ok == true' /tmp/supabase_response.json > /dev/null
          echo "Sincronización completada correctamente."
