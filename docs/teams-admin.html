<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teams · Sprint Pádel</title>
<link rel="stylesheet" href="teams-admin.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="top"><div><span class="eyebrow">SPRINT PÁDEL</span><h1>Teams</h1><p>Copa por equipos · Administración</p></div><button id="btnNuevo" class="primary">＋ Crear Teams</button></header>
<main>
<section id="avisoSesion" class="notice hidden">Necesitas una sesión de administrador válida para gestionar Teams.</section>
<section id="lista" class="cards"><div class="empty">Cargando Teams…</div></section>
<section id="wizard" class="panel hidden">
<div class="panel-head"><div><span class="eyebrow">NUEVO TEAMS</span><h2 id="pasoTitulo">1 · Datos generales</h2></div><button id="btnCerrar" class="ghost">Cerrar</button></div>
<div class="steps" id="steps"></div>
<form id="formTeams">
<div class="step" data-step="1">
<label>Nombre del Teams<input id="nombre" required placeholder="Teams Octubre 2026"></label>
<div class="grid2"><label>Fecha inicio<input id="fechaInicio" type="date"></label><label>Fecha fin<input id="fechaFin" type="date"></label></div>
<label>Formato<select id="modalidad"><option value="numero_fijo">Número fijo de partidos</option><option value="mejor_de" selected>Al mejor de X</option><option value="mejor_de_jugar_todos">Al mejor de X, jugando todos</option><option value="numero_fijo_desempate">Número fijo + desempate</option></select></label>
<div class="grid2"><label>N.º partidos<input id="numeroPartidos" type="number" min="1" value="7"></label><label>Puntos por victoria<input id="puntosVictoria" type="number" min="0" step=".5" value="1"></label></div>
<div class="checks"><label><input id="estadisticas" type="checkbox" checked> Estadísticas Teams</label><label><input id="ranking" type="checkbox"> Ranking</label><label><input id="isp" type="checkbox"> ISP</label></div>
</div>
<div class="step hidden" data-step="2">
<label>Método de formación<select id="metodo"><option value="manual">Manual</option><option value="draft">Draft de capitanes</option><option value="sorteo">Sorteo</option></select></label>
<div class="grid2"><label>Jugadores por equipo<input id="jugadoresEquipo" type="number" min="1" placeholder="8"></label><label>Reservas por equipo<input id="reservasEquipo" type="number" min="0" value="0"></label></div>
<div id="draftOpciones" class="sub hidden"><label>Tipo de draft<select id="tipoDraft"><option value="alterno">Alterno A-B-A-B</option><option value="serpiente">Serpiente A-B-B-A</option><option value="secreto_rondas">Secreto por rondas</option><option value="conjunto">Selección conjunta</option></select></label></div>
</div>
<div class="step hidden" data-step="3">
<label>Repetición de jugadores<select id="repetirJugadores"><option value="no">No</option><option value="si" selected>Sí</option><option value="maximo">Sí, máximo X partidos</option></select></label>
<label id="maxWrap" class="hidden">Máximo de partidos por jugador<input id="maxPartidosJugador" type="number" min="1"></label>
<div class="checks"><label><input id="repetirPareja" type="checkbox"> Permitir repetir pareja</label><label><input id="todosAntes" type="checkbox"> Todos deben jugar antes de repetir</label></div>
</div>
<div class="step hidden" data-step="4">
<label>Sistema de elección de parejas<select id="sistemaParejas"><option value="secreto">Secreto</option><option value="alterno">Alterno</option><option value="ganador_primero">Ganador anterior presenta primero</option></select></label>
<div id="presentadorOpciones" class="sub hidden"><label>Quién presenta primero el Partido 1<select id="primerPresentador"><option value="sorteo">Sorteo</option><option value="equipo_a">Equipo A</option><option value="equipo_b">Equipo B</option></select></label><label class="checkline"><input id="segundoVe" type="checkbox"> El segundo equipo ve la pareja presentada</label></div>
<label>Plazo para presentar pareja (horas)<input id="plazoPresentar" type="number" min="1" value="48"></label>
</div>
<div class="step hidden" data-step="5">
<label>Publicación de parejas<select id="modoPublicacion"><option value="inmediata">Al confirmar ambos</option><option value="programada">Fecha/hora programada</option><option value="manual">Manual por administrador</option></select></label>
<label id="publicarWrap" class="hidden">Publicar el<input id="publicarAt" type="datetime-local"></label>
<div class="grid2"><label>Plazo para acordar fecha (días)<input id="plazoAcordar" type="number" min="1" value="3"></label><label>Plazo para jugar (días)<input id="plazoJugar" type="number" min="1" value="7"></label></div>
<label>Partido no finalizado<select id="noFinalizado"><option value="reanudar">Debe reanudarse</option><option value="administrador">Resolver administrador</option></select></label>
</div>
<div class="step hidden" data-step="6"><div id="resumen" class="summary"></div></div>
<div class="actions"><button type="button" id="btnAnterior" class="ghost hidden">← Anterior</button><span></span><button type="button" id="btnSiguiente" class="primary">Siguiente →</button><button type="submit" id="btnCrear" class="primary hidden">Crear Teams</button></div>
</form></section>
</main>
<div id="toast" class="toast hidden"></div>
<script src="teams-admin.js"></script>
</body></html>
